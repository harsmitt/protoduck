name: Build DuckDB 1.5.5

on:
  push:
    branches:
      - build-duckdb-1.5.5
  workflow_dispatch:

jobs:
  build:
    name: Build and test on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Configure DuckDB 1.5.5 test environment
        run: sed -i 's/TARGET_DUCKDB_VERSION=v1.5.4/TARGET_DUCKDB_VERSION=v1.5.5/' Makefile && DUCKDB_TEST_VERSION=1.5.5 make configure

      - name: Build Protoduck release extension
        run: make release

      - name: Run SQL tests
        run: make test_release
